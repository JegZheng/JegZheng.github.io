<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.nav %}
        {% assign active = false %}
        {% if item.url == "/" %}{% if page.url == "/" %}{% assign active = true %}{% endif %}
        {% elsif page.url contains item.url %}{% assign active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        {% include icon.html name="sun" %}{% include icon.html name="moon" %}
      </button>
    </nav>
  </div>
</header>
