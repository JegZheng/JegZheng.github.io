# Site settings
title: Huangjie Zheng
description: >-
  Huangjie Zheng is a Research Scientist at Apple Machine Learning Research
  working on generative modeling, diffusion models, normalizing flows and
  diffusion language models.
url: "https://jegzheng.github.io"
baseurl: ""
lang: en
timezone: America/Los_Angeles

# Author / profile
author:
  name: Huangjie Zheng
  cjk_name: 郑煌杰
  me: "Huangjie Zheng"          # exact string bolded in author lists
  role: Research Scientist
  affiliation: Apple Machine Learning Research
  affiliation_url: https://machinelearning.apple.com/
  location: Cupertino, CA
  email: huangjie_zheng@apple.com
  photo: /images/profile.jpg
  scholar: https://scholar.google.com/citations?user=Vl5wCXsAAAAJ
  github: https://github.com/JegZheng
  twitter: https://twitter.com/UnderGroundJeg
  linkedin: https://www.linkedin.com/in/huangjie-zheng-83180295/
  orcid: https://orcid.org/0000-0003-0508-5034
  semanticscholar: https://www.semanticscholar.org/author/Huangjie-Zheng/8158616

# Navigation
nav:
  - title: About
    url: /
  - title: Publications
    url: /publications/

# How many news items to show on the home page
news_limit: 6

# Build
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge
sass:
  style: compressed
permalink: pretty
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - .sass-cache
  - .jekyll-cache
  - "*.zip"

# Default social-sharing image
logo: /images/profile.jpg
