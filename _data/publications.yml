# Publications. One entry per paper. Newest first (the site sorts by `date`).
#
# Fields:
#   key        unique id, also used as the BibTeX key
#   title      paper title
#   authors    full author list in order; "Huangjie Zheng" is bolded automatically
#   venue      short badge shown on the site, e.g. "ICLR 2026", "arXiv"
#   venue_full long venue name, used in the generated BibTeX
#   year       year used for grouping on the publications page
#   date       used for ordering (YYYY-MM-DD)
#   note       optional highlight, e.g. "Oral", "Spotlight"
#   arxiv      arXiv id (gives Paper + PDF links)
#   url        official page (OpenReview / publisher) if different from arXiv
#   code       code repository
#   project    project page
#   selected   true to show on the home page

